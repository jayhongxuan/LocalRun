# LocalRun Windows 安装包构建（NSIS .exe）
# 触发：GitHub Actions 页面手动 Run workflow。
# 不使用 npm；前端是静态 ui/，由 Tauri 直接打包。
name: build-windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install tauri-cli v2
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Windows NSIS installer
        working-directory: src-tauri
        run: cargo tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LocalRun-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
